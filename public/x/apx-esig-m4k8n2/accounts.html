  <script>
    (function () {
      var ASSET_HOST = "https://www.apx-fs.co.uk";
      var sig = document.getElementById("apx-sig");
      var status = document.getElementById("status");

      function htmlForEmail() {
        return sig.outerHTML.replace(
          /(src=")(\/email-signatures\/[^"]+)(")/g,
          function (_, a, path, b) { return a + ASSET_HOST + path + b; }
        );
      }

      document.getElementById("copy-btn").addEventListener("click", async function () {
        try {
          await navigator.clipboard.writeText(htmlForEmail());
          status.textContent = "Copied. Paste into your email signature settings.";
        } catch (e) {
          status.textContent = "Copy failed � use Select signature, then Cmd/Ctrl+C.";
        }
      });
      document.getElementById("select-btn").addEventListener("click", function () {
        var range = document.createRange();
        range.selectNodeContents(sig);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        status.textContent = "Selected � Cmd/Ctrl+C to copy.";
      });
    })();
  </script>
